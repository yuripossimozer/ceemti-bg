<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fdfcff" id="meta-theme-color">
  
  <title>Resultados Finais</title>

  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="icon" type="image/png" href="../icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme');
        const metaTheme = document.getElementById('meta-theme-color');
        
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          if (metaTheme) metaTheme.setAttribute('content', '#111315');
        }
      } catch (e) { 
        console.error(e); 
      }
    })();
  </script>

  <style>
    /* =========================================
       VARIÁVEIS & TEMA
       ========================================= */
    :root {
      --primary: #005fa4;
      --on-primary: #ffffff;
      --primary-container: #d5e3ff;
      --on-primary-container: #001b3c;
      --success: #146c2e;
      --on-success: #ffffff;
      --background: #fdfcff;
      --surface: #fdfcff;
      --surface-container: #f0f4f9;
      --outline: #74777f;
      --outline-variant: #c4c7cf;
      --text-main: #1a1c1e;
      --text-secondary: #3b3f46;
      --bg-header: #dfe4ec;
      --table-stripe: rgba(0, 95, 164, 0.04);
      --radius-card: 24px;
      --radius-btn: 100px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] {
      --primary: #a8c7fa;
      --on-primary: #00315b;
      --primary-container: #004786;
      --on-primary-container: #d5e3ff;
      --success: #6dd58c;
      --on-success: #00391a;
      --background: #111315;
      --surface: #111315;
      --surface-container: #1d2024;
      --outline: #8e9099;
      --outline-variant: #44474e;
      --text-main: #e2e2e6;
      --text-secondary: #c4c7c5;
      --bg-header: #2a2d31;
      --table-stripe: rgba(168, 199, 250, 0.05);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
      --shadow-md: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* =========================================
       ESTRUTURA BASE
       ========================================= */
    html { width: 100%; overflow-x: hidden; }
    body {
      width: 100%;
      min-height: 100dvh;
      background-color: var(--background);
      color: var(--text-main);
      font-family: 'Roboto', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-bottom: 60px;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================
       COMPONENTES UI
       ========================================= */
    .app-bar {
      background-color: var(--surface-container);
      padding: 1rem 1.5rem;
      border-radius: var(--radius-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      border: 1px solid var(--outline-variant);
    }
    .app-title { font-weight: 700; color: var(--text-secondary); font-size: 1.25rem; }
    .m-card {
      background-color: var(--surface-container);
      border-radius: var(--radius-card);
      padding: 1.5rem;
      border: 1px solid var(--outline-variant);
      margin-bottom: 1.5rem;
    }
    .table > tbody > tr > td {
      background-color: transparent !important;
      color: var(--text-main) !important;
      border-color: var(--outline-variant) !important;
      vertical-align: middle;
    }
    .table thead th {
      background-color: var(--bg-header) !important;
      color: var(--text-secondary) !important;
      border-bottom: 1px solid var(--outline-variant);
      border-color: var(--outline-variant) !important;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      white-space: nowrap;
      padding: 12px;
    }
    .table-hover tbody tr:hover td {
      background-color: var(--primary-container) !important;
      color: var(--on-primary-container) !important;
    }
    .form-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; margin-left: 4px; }
    .form-select, .form-control {
      background-color: var(--background);
      border: 1px solid var(--outline);
      color: var(--text-main);
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }
    .form-select:disabled { background-color: var(--outline-variant); opacity: 0.4; border-color: transparent; }
    .btn-icon {
      background: transparent; border: none; color: var(--text-secondary); font-size: 1.2rem; 
      width: 40px; height: 40px; border-radius: 50%; transition: 0.2s; display: inline-flex; 
      align-items: center; justify-content: center;
    }
    .btn-icon:hover { background-color: var(--primary-container); color: var(--on-primary-container); }
    .btn-action {
      background-color: var(--primary); color: var(--on-primary); border: none; 
      border-radius: var(--radius-btn); padding: 0.5rem 1.2rem; font-weight: 500;
      display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); 
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }
    .btn-action:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-action.success-state { background-color: var(--success) !important; color: var(--on-success) !important; pointer-events: none; }
    .btn-action.btn-sm { font-size: 0.75rem; padding: 0.25rem 0.8rem; }
    a.btn-icon { text-decoration: none; color: var(--text-secondary); }
    a.btn-icon:hover { color: var(--on-primary-container); }
    .hover-link:hover { color: var(--on-primary-container) !important; }
    .meta-tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; 
      border-radius: 8px; border: 1px solid var(--outline-variant);
      color: var(--text-secondary); font-size: 0.8rem; font-weight: 500;
    }
    .meta-tag i { color: var(--primary); }
    .modal-content { background-color: var(--surface-container); color: var(--text-main); border: 1px solid var(--outline-variant); border-radius: var(--radius-card); }
    .modal-header, .modal-footer { border-color: var(--outline-variant); }
    .btn-close { filter: invert(0.5); } 
    [data-theme="dark"] .btn-close { filter: invert(1); }
    .chk-container { display: flex; align-items: center; gap: 8px; justify-content: center; }
    .chk-container.start { justify-content: flex-start; }
    .chk-container .form-check-input { margin: 0; cursor: pointer; width: 18px; height: 18px; border: 1px solid var(--outline); }
    .table .form-check-input:checked { background-color: var(--primary); border-color: var(--primary); }
    .form-check-input:checked, .form-check-input:indeterminate { background-color: var(--primary) !important; border-color: var(--primary) !important; }
    .form-check-input:focus { box-shadow: 0 0 0 0.25rem var(--table-stripe); border-color: var(--primary); }    
    .table tbody td.highlight-cell {
      background-color: var(--primary-container) !important; color: var(--on-primary-container) !important;
      transition: background-color 0.2s; border-bottom-color: rgba(255,255,255,0.1) !important;
    }

    /* =========================================
       TELA DE LOADING E CONTAINER PRINCIPAL
       ========================================= */
    #overlay-loading {
      position: fixed; inset: 0; background: var(--background); z-index: 9999; 
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #app-container { display: none; padding-top: 1rem; }
  </style>
</head>
<body>

  <!-- =========================================
       TELA DE CARREGAMENTO (OVERLAY)
       ========================================= -->
  <div id="overlay-loading">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <p class="mt-3 small fw-bold" style="color: var(--text-secondary); letter-spacing: 1px;">AUTENTICANDO</p>
    <div id="loading-error" class="text-danger small fw-bold mt-2 text-center px-4"></div>
  </div>

  <!-- =========================================
       CONTEÚDO PRINCIPAL (APP)
       ========================================= -->
  <div class="container" id="app-container">
    <div class="app-bar">
      <div class="d-flex align-items-center gap-2">
        <span class="app-title">RESULTADOS FINAIS</span>
      </div>
      <div class="d-flex gap-2">
        <a href="../index.html" class="btn-icon" title="Voltar ao Início"><i class="fas fa-home"></i></a>
        <button class="btn-icon" onclick="window.toggleTheme()" title="Alternar Tema"><i class="fas fa-moon" id="icon-theme"></i></button>
        <button class="btn-icon" data-bs-toggle="modal" data-bs-target="#modalConfig" title="Configurações"><i class="fas fa-cog"></i></button>
      </div>
    </div>

    <div class="m-card">
      <h5 class="mb-3" style="color: var(--text-secondary); font-weight: 700; font-size: 1.25rem;">FILTROS DE BUSCA</h5>
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Ano Letivo</label>
          <select id="selAno" class="form-select" onchange="window.aoMudarAno()">
            <option value="" selected disabled>Carregando...</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Turma</label>
          <select id="selTurma" class="form-select" onchange="window.aoMudarTurma()" disabled>
            <option value=""></option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Estudante</label>
          <select id="selAluno" class="form-select" onchange="window.buscarRelatorio()" disabled>
            <option value=""></option>
          </select>
        </div>
      </div>
    </div>

    <div id="resultadoArea"></div>
    <div id="areaNotas"></div>
  </div>

  <!-- =========================================
       MODAL: CONFIGURAÇÕES
       ========================================= -->
  <div class="modal fade" id="modalConfig" tabindex="-1">
    <div class="modal-dialog mt-5">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Configurações</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <h6 class="text-secondary small fw-bold text-uppercase mb-3">Exportação (Tabulação)</h6>
          <div class="mb-3">
            <label class="form-label">Mesclar Aproveitamento</label>
            <input type="number" id="cfgNotas" class="form-control" min="1">
          </div>
          <div class="mb-3">
            <label class="form-label">Mesclar Situação Final</label>
            <input type="number" id="cfgSituacao" class="form-control" min="1">
          </div>
          <div class="d-flex gap-2 mb-4">
             <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="window.resetarConfig()" data-bs-dismiss="modal">Padrão</button>
             <button type="button" class="btn btn-action btn-sm" onclick="window.salvarConfig()" data-bs-dismiss="modal">Salvar</button>
          </div>
          
          <hr class="my-4" style="border-color: var(--outline-variant);">
          
          <h6 class="text-secondary small fw-bold text-uppercase mb-3">Conta e Autenticação</h6>
          <div class="p-3 rounded d-flex align-items-center justify-content-between" style="border: 1px solid var(--outline-variant);">
             <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center justify-content-center rounded-circle" style="width: 40px; height: 40px; background-color: var(--primary-container); color: var(--on-primary-container);">
                  <i class="fas fa-user"></i>
                </div>
                <div style="line-height: 1.2;">
                  <span class="d-block small text-secondary">Logado como</span>
                  <span id="lblUserEmail" class="fw-bold" style="font-size: 0.9rem;">...</span>
                </div>
             </div>
             <button onclick="window.fazerLogout()" class="btn btn-sm btn-outline-danger rounded-pill px-3" data-bs-dismiss="modal">Sair</button>
          </div><br>
          <div class="p-3 rounded d-flex flex-column gap-3" style="border: 1px solid var(--outline-variant);">
             <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                   <div class="d-flex align-items-center justify-content-center rounded-circle" style="width: 40px; height: 40px; background-color: var(--primary-container); color: var(--on-primary-container);">
                     <i class="fas fa-fingerprint"></i>
                   </div>
                   <div style="line-height: 1.2;">
                     <span class="d-block fw-bold" style="font-size: 0.9rem;">Gerenciar Passkeys</span>
                     <span class="d-block small text-secondary">Adicionar, remover e renomear</span>
                   </div>
                </div>
                <button id="btn-add-passkey" onclick="window.cadastrarPasskey()" class="btn btn-sm btn-outline-primary rounded-pill px-3">+</button>
             </div>
   
             <div id="lista-passkeys" class="d-flex flex-column gap-2 mt-2 pt-3" style="border-top: 1px solid var(--outline-variant); display: none !important;">
                <div class="text-center small text-secondary py-2 spinner-border spinner-border-sm mx-auto" role="status"></div>
             </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // =========================================================
    // 1. CONFIGURAÇÕES E ESTADO GLOBAL
    // =========================================================
    const SUPABASE_URL = "https://gtawjrszrzmuftzjoqyk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_k7C3tn6q8LaJrco8GSdQ7A_l2qJQxIb";
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        experimental: { passkey: true }
      }
    });
    
    let DADOS_RELATORIO_ATUAL = null; 
    let DADOS_NOTAS_ATUAL = null; 
    let TIMER_INATIVIDADE = null;
    const SESSAO_TIMEOUT_MS = 25 * 60 * 1000; // 25 minutos

    // =========================================================
    // 2. CAMADA DE DADOS (DataService) 
    // =========================================================
    const DataService = {
      buscarAnos: async function() {
        const { data, error } = await supabaseClient
          .from('turmas')
          .select('ano');

        if (error) throw error;
        return [...new Set(data.map(item => item.ano))].sort().reverse();
      },

      buscarTurmas: async function(ano) {
        const { data, error } = await supabaseClient
          .from('turmas')
          .select('nome')
          .eq('ano', ano);

        if (error) throw error;
        return [...new Set(data.map(item => item.nome))].sort();
      },

      buscarAlunos: async function(ano, turma) {
        const { data, error } = await supabaseClient
          .from('vw_hierarquia_filtros')
          .select('estudante')
          .eq('ano', ano)
          .eq('turma', turma);

        if (error) throw error;
        return [...new Set(data.map(item => item.estudante))].sort();
      },

      buscarDadosRelatorio: async function(anoSelecionado, nomeAluno) {
        const { data: estData, error: errEst } = await supabaseClient
          .from('estudantes')
          .select('id, nome, cd_sistec')
          .eq('nome', nomeAluno)
          .single();

        if (errEst) throw new Error("Estudante não encontrado.");

        const { data: matData, error: errMat } = await supabaseClient
          .from('matriculas')
          .select(`
            ch_anual, dias_letivos, tot_faltas, porc_faltas, res_final, observacoes,
            turmas (ano, nome, ocs(codigo))
          `)
          .eq('estudante_id', estData.id);

        if (errMat) throw new Error("Erro ao buscar matrículas.");

        const oc = matData[0]?.turmas?.ocs?.codigo || "NA";
        const anoBase = parseInt(anoSelecionado);
        const trajetoria = [];

        for (let i = 0; i < 3; i++) {
          let anoB = anoBase + i;
          let matAno = matData.find(m => m.turmas.ano === anoB);
          
          if (matAno) {
            trajetoria.push({ 
              existe: true, ano: matAno.turmas.ano, turma: matAno.turmas.nome, 
              ch: matAno.ch_anual, dias: matAno.dias_letivos, faltas: matAno.tot_faltas, 
              porc: matAno.porc_faltas, res: matAno.res_final, obs: matAno.observacoes 
            });
          } else {
            trajetoria.push({ existe: false, ano: anoB, turma: "-" });
          }
        }

        const anosRegistrados = [...new Set(matData.map(m => m.turmas.ano))].sort((a,b)=>a-b).join(', ');

        return { 
          aluno: estData.nome, 
          oc: oc, 
          sistec: estData.cd_sistec, 
          anosRegistrados: anosRegistrados, 
          trajetoria: trajetoria 
        };
      },

      buscarNotas: async function(nomeAluno, codigoOC, trajetoria) {
        const { data: ocData } = await supabaseClient.from('ocs').select('id').eq('codigo', codigoOC).single();
        if (!ocData) throw new Error("OC não encontrada");

        const { data: disciplinas } = await supabaseClient.from('disciplinas').select('nome').eq('oc_id', ocData.id).order('ordem');
        const nomesDisciplinas = disciplinas.map(d => d.nome);

        const { data: estData } = await supabaseClient.from('estudantes').select('id').eq('nome', nomeAluno).single();
        const { data: matriculas } = await supabaseClient.from('matriculas').select('id, turmas(ano, nome)').eq('estudante_id', estData.id);
        const matriculasIds = matriculas.map(m => m.id);

        const { data: notasBD } = await supabaseClient
          .from('notas')
          .select(`nota, ch, falta, disciplinas(nome), matricula_id`)
          .in('matricula_id', matriculasIds);

        const mapaNotas = {};
        notasBD.forEach(n => {
            const mat = matriculas.find(m => m.id === n.matricula_id);
            if (mat && n.disciplinas) {
                const chave = `${mat.turmas.ano}|${mat.turmas.nome}|${n.disciplinas.nome}`;
                mapaNotas[chave] = { nota: n.nota, ch: n.ch, falta: n.falta };
            }
        });

        const tabelaFinal = nomesDisciplinas.map(discNome => {
            let linha = { disciplina: discNome, anos: [] };
            trajetoria.forEach(t => {
                if (t.existe) {
                    const chave = `${t.ano}|${t.turma}|${discNome}`;
                    linha.anos.push(mapaNotas[chave] || { nota: "-", ch: "-", falta: "-" });
                } else {
                    linha.anos.push({ nota: "-", ch: "-", falta: "-" });
                }
            });
            return linha;
        });

        return tabelaFinal;
      }
    };


    // =========================================================
    // BLOQUEIO DO BOTÃO VOLTAR (BFCache)
    // =========================================================
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (!session) {
            document.getElementById('app-container').style.display = 'none';
            window.location.replace("index.html");
          }
        });
      }
    });

    // =========================================================
    // 3. AUTENTICAÇÃO E INATIVIDADE
    // =========================================================
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if ((event === 'SIGNED_OUT' || !session) && !FAZENDO_LOGOUT_MANUAL) {
        document.getElementById('app-container').style.display = 'none';
        window.location.replace("index.html");
      }
    });
    
    window.onload = async function() {
      try {
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
           const icon = document.getElementById('icon-theme');
           if (icon) icon.classList.replace('fa-moon', 'fa-sun');
        }
        window.carregarConfig();
      } catch(e) {}

      if (window.location.hash) {
        window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
      }

      try { 
        const { data: { user }, error } = await supabaseClient.auth.getUser();

        if (error || !user) {
          window.location.replace("index.html");
          return;
        }

        const { data: permData, error: permError } = await supabaseClient
            .from('usuarios_permitidos')
            .select('email')
            .eq('email', user.email);
        
        if (permError || !permData || permData.length === 0) {
          window.fazerLogout('nao_autorizado');
          return;
        }

        if (document.getElementById('lblUserEmail')) {
            document.getElementById('lblUserEmail').innerText = user.email;
        }

        await window.inicializarApp();
    
        document.getElementById('overlay-loading').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        reiniciarTimerInatividade();

      } catch (e) {
        document.getElementById('loading-error').innerText = (e.message || JSON.stringify(e)); 
        setTimeout(() => window.fazerLogout(), 3000);
      }
    };
    
    window.fazerLogout = async function(motivo) {
      FAZENDO_LOGOUT_MANUAL = true; 
      document.getElementById('app-container').style.display = 'none';
      const overlay = document.getElementById('overlay-loading');
      overlay.style.display = 'flex';
      
      overlay.innerHTML = `
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        <p class="mt-3 small fw-bold" style="color: var(--text-secondary); letter-spacing: 1px;">ENCERRANDO SESSÃO</p>
      `;

      await supabaseClient.auth.signOut();
      
      let urlDestino = "index.html";
      if (motivo === 'expirado') urlDestino += "?erro=expirado";
      else if (motivo === 'nao_autorizado') urlDestino += "?erro=nao_autorizado";
      
      window.location.replace(urlDestino);
    };

    function reiniciarTimerInatividade() {
      if (TIMER_INATIVIDADE) clearTimeout(TIMER_INATIVIDADE);
      TIMER_INATIVIDADE = setTimeout(() => {
        window.fazerLogout('expirado');
      }, SESSAO_TIMEOUT_MS);
    }

    document.addEventListener("click", reiniciarTimerInatividade);
    document.addEventListener("keypress", reiniciarTimerInatividade);


    // =========================================================
    // 4. MANIPULAÇÃO DE UI E RENDERIZAÇÃO 
    // =========================================================
    window.limparTela = function() { 
      document.getElementById('resultadoArea').innerHTML = ''; 
      document.getElementById('areaNotas').innerHTML = ''; 
      DADOS_RELATORIO_ATUAL = null; 
      DADOS_NOTAS_ATUAL = null; 
    };

    window.inicializarApp = async function() {

    window.escapeHTML = function(str) {
      if (str === null || str === undefined || str === "") return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    };

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
    }

    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function animarMetaCor(corOrigem, corDestino, duration) {
      const start = hexToRgb(corOrigem); const end = hexToRgb(corDestino);
      const metaTag = document.getElementById('meta-theme-color');
      if (!start || !end || !metaTag) return;
      let startTime = null;
      function animationStep(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = timestamp - startTime;
        const percent = Math.min(progress / duration, 1);
        const r = Math.round(start.r + (end.r - start.r) * percent);
        const g = Math.round(start.g + (end.g - start.g) * percent);
        const b = Math.round(start.b + (end.b - start.b) * percent);
        metaTag.setAttribute('content', rgbToHex(r, g, b));
        if (progress < duration) window.requestAnimationFrame(animationStep);
      }
      window.requestAnimationFrame(animationStep);
    }

    window.toggleTheme = function() {
      const htmlTag = document.documentElement;
      const icon = document.getElementById('icon-theme');
      const COR_LIGHT = '#fdfcff'; const COR_DARK = '#111315';
      const isDark = htmlTag.getAttribute('data-theme') === 'dark';
      if (isDark) {
        htmlTag.removeAttribute('data-theme');
        if (icon) icon.classList.replace('fa-sun', 'fa-moon');
        localStorage.setItem('theme', 'light'); animarMetaCor(COR_DARK, COR_LIGHT, 300);
      } else {
        htmlTag.setAttribute('data-theme', 'dark');
        if (icon) icon.classList.replace('fa-moon', 'fa-sun');
        localStorage.setItem('theme', 'dark'); animarMetaCor(COR_LIGHT, COR_DARK, 300);
      }
    };

    window.formatarCelula = function(valor, mesclagem) { 
      if (valor === null || valor === undefined || valor === "") valor = "-"; 
      const qtdTabs = Math.max(0, (mesclagem || 1) - 1);
      const tabs = "\t".repeat(qtdTabs); 
      return valor + tabs; 
    };    
    
    let frameVisualUpdate = null;

    window.atualizarVisualMatriz = function() {
      const colHeaders = document.querySelectorAll('.chk-col-header');
      const rowChecks = document.querySelectorAll('.chk-row-item');
      const temCol = Array.from(colHeaders).some(c => c.checked);
      const temRow = Array.from(rowChecks).some(r => r.checked);
      const temDadosParaCopiar = (temCol && temRow);
      const btn = document.getElementById('btnCopiarNotas');
      if (btn) btn.style.visibility = temDadosParaCopiar ? 'visible' : 'hidden';

      if (frameVisualUpdate) cancelAnimationFrame(frameVisualUpdate);
      frameVisualUpdate = requestAnimationFrame(() => {
        const mapaCols = Array.from(colHeaders).map(chk => chk.checked);
        const mapaRows = Array.from(rowChecks).map(chk => chk.checked);
        const qtdColsChecked = mapaCols.filter(Boolean).length;
        const qtdRowsChecked = mapaRows.filter(Boolean).length;
        const isTodasCols = (colHeaders.length > 0 && colHeaders.length === qtdColsChecked);
        const isTodasRows = (rowChecks.length > 0 && rowChecks.length === qtdRowsChecked);
        const isTudoFull = (isTodasCols && isTodasRows);

        if (btn && temDadosParaCopiar) {
             const novoTexto = isTudoFull ? '<i class="fas fa-copy"></i> Copiar' : '<i class="fas fa-copy"></i> Copiar Seleção';
             if (btn.innerHTML !== novoTexto) btn.innerHTML = novoTexto;
        }

        const master = document.getElementById('chk-all-rows');
        if (master) {
           master.checked = isTodasRows;
           master.indeterminate = (qtdRowsChecked > 0 && qtdRowsChecked < rowChecks.length);
        }

        rowChecks.forEach((chk, idxRow) => {
          const tr = chk.closest('tr');
          const isRowAtiva = mapaRows[idxRow];
          const cells = tr.children; 
          for (let i = 1; i < cells.length; i++) {
             const td = cells[i];
             const anoIdx = parseInt(td.getAttribute('data-year-idx'));
             if (isNaN(anoIdx)) continue;
             const isColAtiva = mapaCols[anoIdx];
             const devePintar = (!isTudoFull && isRowAtiva && isColAtiva);
             const jaTemClasse = td.classList.contains('highlight-cell');
             if (devePintar && !jaTemClasse) td.classList.add('highlight-cell');
             else if (!devePintar && jaTemClasse) td.classList.remove('highlight-cell');
          }
        });
        frameVisualUpdate = null;
      });
    };

    window.copiarNotas = function(btnElement) { 
      if (!DADOS_NOTAS_ATUAL) { alert("Erro: Dados não carregados na memória."); return; }
      try {
        const inputCfg = document.getElementById('cfgNotas');
        const valorCfg = inputCfg ? parseInt(inputCfg.value) : 3;
        const notasTabs = isNaN(valorCfg) ? 3 : valorCfg;
        let texto = ""; 
        const colunasHeaders = document.querySelectorAll('.chk-col-header');
        if (colunasHeaders.length === 0) throw new Error("Cabeçalhos de coluna não encontrados.");
        
        const colunasMarcadas = Array.from(colunasHeaders).map(chk => chk.checked);
        const linhasDOM = document.querySelectorAll('#tabelaNotasMain tbody tr');
        
        linhasDOM.forEach((tr) => {
          const chkRow = tr.querySelector('.chk-row-item');
          if (chkRow && chkRow.checked) {
            const idxDados = parseInt(chkRow.getAttribute('data-row-index'));
            const dadosLinha = DADOS_NOTAS_ATUAL[idxDados]; 
            if (!dadosLinha) return; 
            let linhaTexto = ""; 
            if (dadosLinha.anos) {
              dadosLinha.anos.forEach((ano, idxAno) => { 
                if (colunasMarcadas[idxAno] !== undefined && colunasMarcadas[idxAno] === true) {
                   linhaTexto += window.formatarCelula(ano.nota, notasTabs) + "\t" + 
                                 window.formatarCelula(ano.ch, notasTabs) + "\t" + 
                                 window.formatarCelula(ano.falta, notasTabs) + "\t"; 
                }
              });
            }
            if (linhaTexto) texto += linhaTexto + "\n";
          }
        }); 
        if (texto === "") { alert("Nenhum item selecionado para cópia."); return; }
        window.executarCopiaReal(texto, btnElement); 
      } catch (error) { alert("Erro ao processar cópia: " + error.message); }
    };

    window.copiarSituacao = function(btnElement) { 
      if (!DADOS_RELATORIO_ATUAL) return; 
      const checkboxes = document.querySelectorAll('.chk-sit-item');
      if (checkboxes.length === 0) return;
      const cfg = { situacao: parseInt(document.getElementById('cfgSituacao').value) || 9 }; 
      const trajetoria = DADOS_RELATORIO_ATUAL.trajetoria; 
      let linhaCH = "", linhaDias = "", linhaFaltas = "", linhaPorc = "", linhaRes = ""; 
      let temSelecionado = false;

      checkboxes.forEach(chk => {
        if (chk.checked) {
            temSelecionado = true;
            const idx = parseInt(chk.value); 
            const t = trajetoria[idx];
            if (t) {
                const porcFormatada = (t.existe && t.porc != null && t.porc !== "") 
                                      ? String(t.porc).replace('.', ',') 
                                      : "-";

                linhaCH += window.formatarCelula(t.existe ? t.ch : "-", cfg.situacao) + "\t"; 
                linhaDias += window.formatarCelula(t.existe ? t.dias : "-", cfg.situacao) + "\t"; 
                linhaFaltas += window.formatarCelula(t.existe ? t.faltas : "-", cfg.situacao) + "\t"; 
                linhaPorc += window.formatarCelula(porcFormatada, cfg.situacao) + "\t"; 
                linhaRes += window.formatarCelula(t.existe ? t.res : "-", cfg.situacao) + "\t"; 
            }
        }
      });
      if (!temSelecionado) { alert("Nenhum ano selecionado para cópia."); return; }
      let texto = linhaCH + "\n" + linhaDias + "\n" + linhaFaltas + "\n" + linhaPorc + "\n" + linhaRes; 
      window.executarCopiaReal(texto, btnElement); 
    };

    window.copiarObservacoes = function(btnElement) { 
      if (!DADOS_RELATORIO_ATUAL) return; 
      const listaObs = DADOS_RELATORIO_ATUAL.trajetoria
        .filter(t => t.existe && t.obs && String(t.obs).trim() !== "")
        .map(t => t.obs); 
      if (listaObs.length === 0) { alert("Não há observações."); return; } 
      window.executarCopiaReal(listaObs.join("\n"), btnElement); 
    };

    window.copiarSistec = function(btnElement) {
      if (!DADOS_RELATORIO_ATUAL || !DADOS_RELATORIO_ATUAL.sistec) return;
      window.executarCopiaReal(DADOS_RELATORIO_ATUAL.sistec, btnElement);
    };

    window.copiarObservacoesSelecionadas = function(btnElement) {
      const marcados = document.querySelectorAll('.chk-obs-item:checked');
      if (marcados.length === 0) return; 
      const textoFinal = Array.from(marcados).map(chk => chk.value).join("\n");
      window.executarCopiaReal(textoFinal, btnElement);
    };

    window.executarCopiaReal = function(texto, btn) { 
      const textarea = document.createElement('textarea'); 
      textarea.value = texto; textarea.style.position = 'fixed'; 
      textarea.style.left = '0'; textarea.style.top = '0'; textarea.style.opacity = '0.1'; 
      
      document.body.appendChild(textarea); 
      textarea.focus(); textarea.select(); 
      
      try { 
        const ok = document.execCommand('copy'); 
        if (ok && btn) { 
          const originalHTML = btn.innerHTML; 
          btn.innerHTML = '<i class="fas fa-check"></i> Copiado!'; 
          btn.classList.add('success-state'); 
          setTimeout(() => { btn.innerHTML = originalHTML; btn.classList.remove('success-state'); }, 2000); 
        } 
      } catch (err) { alert("Erro ao copiar."); } 
      document.body.removeChild(textarea); 
    };

    window.cadastrarPasskey = async function() { 
      const btn = document.getElementById('btn-add-passkey');
      const originalText = btn.innerHTML;
  
      btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
      btn.disabled = true;

      try {
        const { data, error } = await supabaseClient.auth.registerPasskey();
    
        if (error) {
          console.error(error);
          alert("Não foi possível registrar o dispositivo: " + error.message);
        } else {
          btn.classList.replace('btn-outline-primary', 'btn-success');
          btn.style.color = "#fff";
          btn.innerHTML = '<i class="fas fa-check"></i> Cadastrado';
          window.carregarPasskeys();
      
          setTimeout(() => {
             btn.classList.replace('btn-success', 'btn-outline-primary');
             btn.style.color = "";
             btn.innerHTML = originalText;
          }, 3000);
        }
      } catch (err) {
        alert("Erro inesperado ao invocar WebAuthn: " + err.message);
      } finally {
        btn.disabled = false;
        if(btn.innerHTML.includes('spinner')) {
           btn.innerHTML = originalText;
        }
      }
    };

    window.carregarPasskeys = async function() {
      const listaContainer = document.getElementById('lista-passkeys');
      listaContainer.style.setProperty('display', 'flex', 'important');
      listaContainer.innerHTML = '<div class="text-center small text-secondary py-2"><span class="spinner-border spinner-border-sm"></span> Carregando</div>';

      try {
        const { data: passkeys, error } = await supabaseClient.auth.passkey.list();
    
        if (error) throw error;

        if (!passkeys || passkeys.length === 0) {
          listaContainer.innerHTML = '<div class="text-center small text-secondary py-2 fst-italic">Nenhum dispositivo registado.</div>';
          return;
        }

        let htmlLista = '';
        passkeys.forEach(pk => {
          const dataCriacao = new Date(pk.created_at).toLocaleDateString('pt-PT');
      
          htmlLista += `
            <div class="d-flex justify-content-between align-items-center p-2 rounded hover-obs-item" style="background-color: var(--background); border: 1px solid var(--outline-variant);">
               <div class="d-flex flex-column overflow-hidden pe-2">
                  <span class="fw-bold small text-truncate" style="color: var(--text-main);">${window.escapeHTML(pk.friendly_name || 'Dispositivo Desconhecido')}</span>
                  <span class="small" style="font-size: 0.75rem; color: var(--text-secondary);">Adicionada em ${dataCriacao}</span>
               </div>
               <div class="d-flex gap-1 flex-shrink-0">
                  <button onclick="window.renomearPasskey('${pk.id}', '${window.escapeHTML(pk.friendly_name || '')}')" class="btn btn-icon btn-sm" style="width: 30px; height: 30px;" title="Mudar nome">
                     <i class="fas fa-pen" style="font-size: 0.8rem;"></i>
                  </button>
                  <button onclick="window.removerPasskey('${pk.id}')" class="btn btn-icon btn-sm text-danger" style="width: 30px; height: 30px;" title="Remover">
                     <i class="fas fa-trash" style="font-size: 0.8rem;"></i>
                  </button>
              </div>
            </div>
          `;
        });
    
        listaContainer.innerHTML = htmlLista;

      } catch (err) {
        listaContainer.innerHTML = `<div class="alert alert-danger p-2 small m-0">Erro: ${err.message}</div>`;
      }
    };

    window.removerPasskey = async function(id) {
      if (!confirm("Tem a certeza que deseja remover este dispositivo? Não poderá usá-lo para iniciar sessão.")) return;
  
      try {
        const { error } = await supabaseClient.auth.passkey.delete({ passkeyId: id });
        if (error) throw error;
    
        window.carregarPasskeys();
      } catch (err) {
        alert("Erro ao remover: " + err.message);
      }
    };

    window.renomearPasskey = async function(id, nomeAtual) {
      const novoNome = prompt("Introduza um novo nome para este dispositivo (ex: iPhone do João, PC Trabalho):", nomeAtual);
  
      if (novoNome === null || novoNome.trim() === "" || novoNome === nomeAtual) return;

      try {
        const { error } = await supabaseClient.auth.passkey.update({
          passkeyId: id,
          friendlyName: novoNome.trim()
        });
    
        if (error) throw error;
    
        window.carregarPasskeys();
      } catch (err) {
        alert("Erro ao mudar o nome: " + err.message);
      }
    };

    document.getElementById('modalConfig').addEventListener('show.bs.modal', function () {
      window.carregarPasskeys();
    });
  </script>
</body>
</html>
