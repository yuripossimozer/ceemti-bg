<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados Finais</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SUPABASE JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #f0f4f9;
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background-color: #ffffff;
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid #c4c7cf;
    }
    .btn-google {
      background-color: #ffffff;
      color: #3c4043;
      border: 1px solid #dadce0;
      border-radius: 100px;
      padding: 10px 24px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: background-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      width: 100%;
      justify-content: center;
    }
    .btn-google:hover {
      background-color: #f8f9fa;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
    }
    .btn-google img { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <div class="login-card">
    <i class="fas fa-graduation-cap fa-3x mb-3" style="color: #005fa4"></i>
    <h4 class="mb-2">Acesso Restrito</h4>
    <p class="text-secondary small mb-4">Faça login com sua conta institucional para acessar.</p>
    
    <button onclick="fazerLogin()" class="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
      Continuar com o Google
    </button>
    <div id="login-error" class="text-danger small fw-bold mt-3"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://gtawjrszrzmuftzjoqyk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_k7C3tn6q8LaJrco8GSdQ7A_l2qJQxIb";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Verifica se já existe uma sessão ativa ao abrir a página
    window.onload = async function() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = 'resultados.html'; // Redireciona se já estiver logado
      }
    };

    // Função que dispara o OAuth nativo do Supabase
    async function fazerLogin() {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          // Ajuste esta URL para o caminho real do seu GitHub Pages
          redirectTo: window.location.origin + '/resultados.html'
        }
      });
      if (error) {
        document.getElementById('login-error').innerText = "Erro ao conectar: " + error.message;
      }
    }
  </script>
</body>
</html>
