<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados Finais</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { 
        console.error(e); 
      }
    })();
  </script>

  <style>
    /* =========================================
       VARIÁVEIS & TEMA
       ========================================= */
    :root {
      --primary: #005fa4;
      --background: #fdfcff;
      --surface-container: #f0f4f9;
      --outline: #74777f;
      --outline-variant: #c4c7cf;
      --text-main: #1a1c1e;
      --text-secondary: #3b3f46;
      --radius-card: 24px;
    }

    [data-theme="dark"] {
      --primary: #a8c7fa;
      --background: #111315;
      --surface-container: #1d2024;
      --outline: #8e9099;
      --outline-variant: #44474e;
      --text-main: #e2e2e6;
      --text-secondary: #c4c7c5;
    }

    body {
      background-color: var(--background);
      color: var(--text-main);
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    .m-card {
      background-color: var(--surface-container);
      border-radius: var(--radius-card);
      padding: 3rem !important; 
      border: 1px solid var(--outline-variant);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .btn-google {
      background-color: var(--background);
      color: var(--text-main);
      border: 1px solid var(--outline);
      border-radius: 100px;
      padding: 10px 24px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: background-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      width: 100%;
      justify-content: center;
      white-space: nowrap;
    }

    .btn-google:hover {
      background-color: var(--surface-container);
    }

    .btn-google img { 
      width: 20px; 
      height: 20px; 
    }

    .hover-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
    }
    
    .hover-link:hover {
      color: var(--primary) !important;
    }
  </style>
</head>
<body>

  <div class="m-card">
    <div class="text-center mb-4">
       <i class="fas fa-graduation-cap fa-3x mb-3" style="color: var(--primary)"></i>
       <h4 class="mb-2">Acesso Restrito</h4>
       <p class="small mb-0" style="color: var(--text-secondary);">Faça login com sua conta institucional para acessar.</p>
    </div>
    
    <div class="d-flex flex-column align-items-center w-100">
      <button onclick="fazerLogin()" class="btn-google">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
        Continuar com o Google
      </button>

      <div id="mensagem-alerta" class="mt-3 w-100"></div>
      
      <div id="login-error" class="text-danger small fw-bold mt-3 text-center w-100"></div>
      <a href="../index.html" class="mt-4 hover-link">
         <i class="fas fa-arrow-left me-1"></i> Voltar ao Início
      </a>
    </div>
  </div>

  <script>
  const SUPABASE_URL = "https://gtawjrszrzmuftzjoqyk.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_k7C3tn6q8LaJrco8GSdQ7A_l2qJQxIb";
  
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.onload = async function() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = 'resultados.html'; 
    }
  };

  async function fazerLogin() {
    let currentUrl = window.location.origin + window.location.pathname;
    let redirectUrl = currentUrl.replace('index.html', '') + 'resultados.html';

    const { data, error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: redirectUrl
      }
    });
    
    if (error) {
      document.getElementById('login-error').innerText = "Erro ao conectar: " + error.message;
    }
  }
</script>
  
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const erro = params.get('erro');
    const container = document.getElementById('mensagem-alerta');

    if (erro && container) {
      let mensagemHTML = '';

      if (erro === 'nao_autorizado') {
        mensagemHTML = `
          <div class="alert alert-danger d-flex align-items-center" style="border-radius: 12px; text-align: center; font-size: 0.9rem;" role="alert">
              <strong>USUÁRIO NÃO AUTORIZADO</strong>
          </div>
        `;
      } else if (erro === 'expirado') {
        mensagemHTML = `
          <div class="alert alert-warning d-flex align-items-center" style="border-radius: 12px; text-align: center; font-size: 0.9rem;" role="alert">
              <strong>SESSÃO EXPIRADA</strong>
          </div>
        `;
      }

      if (mensagemHTML !== '') {
        container.innerHTML = mensagemHTML;
        
        window.history.replaceState(null, document.title, window.location.pathname);
      }
    }
  });
</script>
</body>
</html>
